name: Audit review validation

on:
  push:
    branches: [review/fiabilisation-audit]
    paths:
      - '.github/workflows/audit-review.yml'
      - 'support/src/**'
      - 'support/test/**'
      - 'support/scripts/**'
      - 'support/package*.json'
      - 'support/eslint.config.js'

permissions:
  contents: read

jobs:
  audit:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: support
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install lockfile dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Record environment
        run: |
          mkdir -p "$RUNNER_TEMP/audit-review"
          { git rev-parse HEAD; node --version; npm --version; } | tee "$RUNNER_TEMP/audit-review/environment.txt"
      - name: Run regression tests
        run: |
          set -o pipefail
          npm test | tee "$RUNNER_TEMP/audit-review/tests.txt"
      - name: Check lint
        run: npm run lint
      - name: Verify documented CVSS arithmetic
        run: node scripts/audit/verify-cvss.js
      - name: Reproduce the immutable baseline
        run: |
          set -o pipefail
          node scripts/audit/reproduce-findings.js | tee "$RUNNER_TEMP/audit-review/baseline.json"
      - name: Check patch whitespace and unchanged working tree
        run: |
          git diff --check 7fbb8f942696bf161ac5e9ead628f1aa740fa00e HEAD
          git diff --exit-code
      - name: Retain only sanitized validation output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-review-${{ matrix.os }}
          path: ${{ runner.temp }}/audit-review/
          retention-days: 7
          if-no-files-found: warn
